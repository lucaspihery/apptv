name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  android:
    name: Android (build, tests unitaires, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Toolchain Rust + cibles Android
        working-directory: rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-bin: true
      - name: cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: NDK
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME}" >> "$GITHUB_ENV"
          echo "NDK : ${ANDROID_NDK_LATEST_HOME}"
      - name: Build, tests unitaires, lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest --stacktrace
      - name: Aperçus des écrans (1920 × 1080)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apercus-ecrans
          path: feature/live/build/previews/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Rapports de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports
          path: |
            **/build/reports/
          retention-days: 7
      - name: APK debug
        uses: actions/upload-artifact@v4
        with:
          name: apptv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
