org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
# ABI Rust à compiler (séparées par des virgules). Pour aller vite en local sur
# la TV : -Papptv.abis=armeabi-v7a ; sur l'émulateur : -Papptv.abis=x86_64
apptv.abis=arm64-v8a,armeabi-v7a,x86_64
